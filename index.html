<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JobScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E4E7EB;
    --text: #14181F;
    --text-soft: #667085;
    --text-faint: #98A2B3;
    --brand: #2F5DFF;
    --brand-soft: #EDF1FF;
    --success-bg: #E7F6EC;
    --success-text: #1B7A3D;
    --amber-bg: #FFF4E5;
    --amber-text: #9A6700;
    --slate-bg: #EEF1F5;
    --slate-text: #475467;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  a{ color: inherit; text-decoration: none; }

  /* Header / hero */
  .topbar{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo{
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-mark{
    width: 26px; height: 26px;
    background: var(--brand);
    border-radius: 7px;
    display: inline-block;
  }

  .hero{
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 24px 32px;
    text-align: center;
  }
  .hero h1{
    font-size: 34px;
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .hero p{
    color: var(--text-soft);
    font-size: 16px;
    margin: 0 0 28px;
  }

  .search-bar{
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
  }
  .search-bar input, .search-bar select{
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    color: var(--text);
  }
  .search-bar input{ flex: 2; }
  .search-bar select{ flex: 1; border-left: 1px solid var(--border); }
  .search-bar input:focus, .search-bar select:focus{ outline: none; }

  .stats-row{
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-faint);
  }
  .stats-row strong{ color: var(--text); font-weight: 600; }

  /* Filter chips */
  .filters{
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-chip{
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-soft);
    cursor: pointer;
  }
  .filter-chip.active{
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  /* Job grid */
  .container{ max-width: 1100px; margin: 0 auto; padding: 24px; }
  .results-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .results-head h2{ font-size: 16px; font-weight: 600; margin: 0; }
  .results-count{ font-size: 13px; color: var(--text-faint); }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  .job-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .job-card:hover{ border-color: var(--brand); box-shadow: 0 2px 10px rgba(20,24,31,0.06); }

  .job-card-top{ display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .job-title{ font-size: 15.5px; font-weight: 600; margin: 0; line-height: 1.35; }
  .job-company{ font-size: 13.5px; color: var(--text-soft); margin: 2px 0 0; }

  .company-badge{
    width: 38px; height: 38px;
    border-radius: 8px;
    background: var(--slate-bg);
    color: var(--slate-text);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }

  .job-tags{ display: flex; flex-wrap: wrap; gap: 6px; }
  .tag{
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 6px;
    background: var(--slate-bg);
    color: var(--slate-text);
  }
  .tag.location{ background: var(--brand-soft); color: var(--brand); }
  .tag.internship{ background: var(--amber-bg); color: var(--amber-text); }
  .tag.fulltime{ background: var(--success-bg); color: var(--success-text); }

  .job-salary{ font-size: 13.5px; font-weight: 600; color: var(--text); margin-top: 2px; }

  .empty{
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-size: 14px;
  }

  /* Modal */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(20,24,31,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .overlay.open{ display: flex; }

  .modal{
    background: var(--surface);
    border-radius: 14px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
  }
  .modal-head{ display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .modal-title{ font-size: 20px; font-weight: 700; margin: 0; }
  .modal-close{
    border: none; background: var(--slate-bg); color: var(--text-soft);
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .modal-company{ font-size: 14.5px; color: var(--text-soft); margin: 4px 0 18px; }

  .modal-tags{ display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

  .modal-section-title{
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-faint); margin: 0 0 10px;
  }
  .req-grid{
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 20px;
    font-size: 13.5px;
    margin-bottom: 24px;
  }
  .req-key{ color: var(--text-soft); }
  .req-val{ color: var(--text); font-weight: 500; }

  .modal-apply{
    display: block;
    text-align: center;
    background: var(--brand);
    color: #fff;
    font-weight: 600;
    font-size: 14.5px;
    padding: 13px;
    border-radius: 9px;
  }
  .modal-apply:hover{ opacity: 0.92; }

  @media (max-width: 640px){
    .hero h1{ font-size: 26px; }
    .search-bar{ flex-direction: column; }
    .search-bar select{ border-left: none; border-top: 1px solid var(--border); }
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="logo-mark"></span>JobScout</div>
  </div>
</div>

<div class="hero">
  <h1>Find your next graduate role</h1>
  <p>Entry-level and graduate-trainee jobs, pulled fresh from Jobberman.</p>
  <div class="search-bar">
    <input id="search" type="text" placeholder="Search job title or company" />
    <select id="location"><option value="">All locations</option></select>
  </div>
  <div class="stats-row" id="stats"></div>
</div>

<div class="filters" id="type-filters"></div>

<div class="container">
  <div class="results-head">
    <h2>Open roles</h2>
    <span class="results-count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
  let ALL_JOBS = [];
  let activeType = 'all';

  function initials(name){
    if(!name) return '?';
    return name.trim().split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
  }

  function tagClass(type){
    if(!type) return '';
    const t = type.toLowerCase();
    if(t.includes('intern')) return 'internship';
    if(t.includes('full')) return 'fulltime';
    return '';
  }

  function renderStats(jobs){
    const companies = new Set(jobs.map(j => j.company)).size;
    document.getElementById('stats').innerHTML =
      `<span><strong>${jobs.length}</strong> open roles</span><span><strong>${companies}</strong> companies hiring</span>`;
  }

  function renderTypeFilters(jobs){
    const types = ['all', ...new Set(jobs.map(j => j.job_type).filter(Boolean))];
    const el = document.getElementById('type-filters');
    el.innerHTML = types.map(t =>
      `<button class="filter-chip ${t === activeType ? 'active' : ''}" data-type="${t}">${t === 'all' ? 'All roles' : t}</button>`
    ).join('');
    el.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeType = btn.getAttribute('data-type');
        renderTypeFilters(jobs);
        renderJobs();
      });
    });
  }

  function renderLocationFilter(jobs){
    const locations = [...new Set(jobs.map(j => j.location).filter(Boolean))].sort();
    const select = document.getElementById('location');
    select.innerHTML = '<option value="">All locations</option>' +
      locations.map(l => `<option value="${l}">${l}</option>`).join('');
  }

  function renderJobs(){
    const query = document.getElementById('search').value.trim().toLowerCase();
    const location = document.getElementById('location').value;

    const filtered = ALL_JOBS.filter(j => {
      const matchesQuery = !query || (j.title||'').toLowerCase().includes(query) || (j.company||'').toLowerCase().includes(query);
      const matchesLocation = !location || j.location === location;
      const matchesType = activeType === 'all' || j.job_type === activeType;
      return matchesQuery && matchesLocation && matchesType;
    });

    document.getElementById('count').textContent = `${filtered.length} result${filtered.length === 1 ? '' : 's'}`;

    const grid = document.getElementById('grid');
    if(filtered.length === 0){
      grid.innerHTML = `<div class="empty">No roles match your search. Try a different keyword or clear filters.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(job => `
      <div class="job-card" data-id="${job.id}">
        <div class="job-card-top">
          <div>
            <p class="job-title">${job.title || 'Untitled role'}</p>
            <p class="job-company">${job.company || 'Unknown company'}</p>
          </div>
          <div class="company-badge">${initials(job.company)}</div>
        </div>
        <div class="job-tags">
          ${job.location ? `<span class="tag location">${job.location}</span>` : ''}
          ${job.job_type ? `<span class="tag ${tagClass(job.job_type)}">${job.job_type}</span>` : ''}
        </div>
        ${job.salary ? `<div class="job-salary">${job.salary}</div>` : ''}
      </div>
    `).join('');

    grid.querySelectorAll('.job-card').forEach(card => {
      card.addEventListener('click', () => openModal(card.getAttribute('data-id')));
    });
  }

  function openModal(id){
    const job = ALL_JOBS.find(j => String(j.id) === String(id));
    if(!job) return;
    const reqEntries = Object.entries(job.requirements || {});

    document.getElementById('modal').innerHTML = `
      <div class="modal-head">
        <h3 class="modal-title">${job.title || 'Untitled role'}</h3>
        <button class="modal-close" id="close-modal">×</button>
      </div>
      <p class="modal-company">${job.company || 'Unknown company'}</p>
      <div class="modal-tags">
        ${job.location ? `<span class="tag location">${job.location}</span>` : ''}
        ${job.job_type ? `<span class="tag ${tagClass(job.job_type)}">${job.job_type}</span>` : ''}
        ${job.salary ? `<span class="tag">${job.salary}</span>` : ''}
      </div>
      ${reqEntries.length ? `
        <p class="modal-section-title">Requirements</p>
        <div class="req-grid">
          ${reqEntries.map(([k,v]) => `<span class="req-key">${k.replace(':','')}</span><span class="req-val">${v}</span>`).join('')}
        </div>` : ''}
      <a class="modal-apply" href="${job.url}" target="_blank" rel="noopener noreferrer">View and apply on Jobberman</a>
    `;
    document.getElementById('overlay').classList.add('open');
    document.getElementById('close-modal').addEventListener('click', closeModal);
  }

  function closeModal(){
    document.getElementById('overlay').classList.remove('open');
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  fetch('jobs.json')
    .then(res => {
      if(!res.ok) throw new Error('Could not load jobs.json');
      return res.json();
    })
    .then(jobs => {
      ALL_JOBS = jobs;
      renderStats(jobs);
      renderTypeFilters(jobs);
      renderLocationFilter(jobs);
      renderJobs();
    })
    .catch(err => {
      document.getElementById('grid').innerHTML =
        `<div class="empty">Couldn't load jobs.json. Make sure it's in the same folder and you're running a local server (python -m http.server).</div>`;
      console.error(err);
    });

  document.getElementById('search').addEventListener('input', renderJobs);
  document.getElementById('location').addEventListener('change', renderJobs);
</script>

</body>
</html>
